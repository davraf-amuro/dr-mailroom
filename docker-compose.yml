# dr-mailroom — un solo container (D5). Segreti in .env (non committato): copia .env.example e compilalo.
# La porta host 5180 deve restare quella del redirect URI registrato in Google Console (C2).

services:
  dr-mailroom-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: dr-mailroom-api:local
    container_name: dr-mailroom-api
    env_file: .env
    ports:
      - "5180:8080"
    volumes:
      # Cartelle sull'host: gli allegati restano consultabili fuori dal container
      - ${ATTACHMENTS_HOST_PATH:-./data/attachments}:/data/attachments
      - ${KEYS_HOST_PATH:-./data/keys}:/data/keys
      - ${LOGS_HOST_PATH:-./data/logs}:/app/logs
    restart: unless-stopped
